<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일기 쓰기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-top: 10px;
        }
        button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h3>일기 쓰기</h3>
    <p id="current-date"></p>
    <textarea id="diary-content" placeholder="오늘의 일기를 작성하세요..."></textarea><br>
    <button onclick="saveDiary()">저장</button>
    <button onclick="viewDiary()">보기</button>
    <p id="message"></p>

    <script>
        const currentDate = new Date().toISOString().split('T')[0];
        document.getElementById('current-date').innerText = `오늘: ${currentDate}`;

        function saveDiary() {
            const content = document.getElementById('diary-content').value;

            if (content) {
                localStorage.setItem(currentDate, content);
                document.getElementById('message').innerText = "일기가 저장되었습니다.";
                document.getElementById('diary-content').value = '';
            } else {
                alert("일기 내용을 입력하세요.");
            }
        }

        function viewDiary() {
            window.open('view.html', '_blank');
        }
    </script>
</body>
</html>
