<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>setTimeout() 시계</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #clock {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #clock-container {
      border: 1px solid black;
      padding: 10px;
      width: 200px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h3>div 태그에 시계 만들기</h3>
  <hr>
  <div id="clock-container">
    <div id="clock">로딩 중...</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date(); 
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0'); // 두 자리 수로 변환
      const seconds = now.getSeconds().toString().padStart(2, '0'); // 두 자리 수로 변환

      
      const ampm = hours >= 12 ? '오후' : '오전';
      const displayHours = hours % 12 || 12; 

      
      document.getElementById('clock').innerText = `${ampm} ${displayHours}:${minutes}:${seconds}`;

      
      setTimeout(updateClock, 1000);
    }

   
    updateClock();
  </script>
</body>

</html>
