<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice 9-6</title>
    <script>
        function wheel(e){
            var img=document.getElementById("wheelimg");
            var size=50;
            if(e.wheelDelta>0)
                size-=5;
            if(size<5)
                size=5;
            else
                size+=5;
            img.style.width=size+"%";
            img.style.height=size+"%";
        }
    </script>
</head>
<body>
    <h3>마우스 휠을 이용한 이미지 확대 / 축소</h3>
    <hr>
    <p>이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.</p>
    <img src="C:\Users\2023user\Documents\2024-2\웹프로그래밍\6주차\apple.jpg" id="wheelimg" onmousewheel="wheel(event)" width="500px" height="500px">
</body>
</html>
